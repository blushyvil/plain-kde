<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.conf'>
<fontconfig>
 <!-- Global default: SF Pro -->
 <match target="pattern">
  <test name="family">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>SF Pro Display</string>
   <string>Source Han Sans JP</string>
   <string>Source Han Sans CN</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>SF Pro Display</string>
   <string>Source Han Serif JP</string>
   <string>Source Han Serif CN</string>
  </edit>
 </match>
 <!-- Emoji: Apple Color Emoji -->
 <match target="pattern">
  <test name="family">
   <string>emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Apple Color Emoji</string>
  </edit>
 </match>
 <!-- Rendering -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <!-- Alias apple-system ke SF Pro -->
 <alias>
  <family>-apple-system</family>
  <prefer>
   <family>SF Pro Display</family>
  </prefer>
 </alias>
 <alias>
  <family>BlinkMacSystemFont</family>
  <prefer>
   <family>SF Pro Display</family>
  </prefer>
 </alias>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
